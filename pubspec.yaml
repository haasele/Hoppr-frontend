name: hoppr_frontend
description: Flutter frontend for Hoppr ticket SaaS platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # HTTP Client
  dio: ^5.4.0
  retrofit: ^4.0.3
  retrofit_generator: ^8.0.4
  json_annotation: ^4.8.1

  # Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Animations
  flutter_animate: ^4.3.0

  # Images
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7

  # Authentication
  flutter_appauth: ^6.0.0
  jwt_decoder: ^2.0.1

  # Utilities
  uuid: ^4.2.1
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1

  # UI
  flutter_slidable: ^3.0.1
  shimmer: ^3.0.0
  carousel_slider: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  drift_dev: ^2.14.1
  retrofit_generator: ^8.0.4

flutter:
  uses-material-design: true
